[project]
name = "liquidator"
version = "0.1.0"
description = "Multi-exchange crypto liquidation portal"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "jinja2==3.1.5",
  "python-multipart==0.0.20",
  "websockets==14.1",
  "httpx==0.28.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "psycopg2-binary==2.9.10",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.0",
  "pyrage==1.2.3",
  "boto3==1.35.90",
  "asyncssh==2.19.0",
  "croniter==5.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[project.scripts]
liquidator = "liquidator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liquidator*"]

[tool.setuptools.package-data]
liquidator = ["web/templates/*", "web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
